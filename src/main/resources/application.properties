spring.application.name=api-gateway-grupo11
server.port=8070
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
spring.cloud.gateway.server.webflux.discovery.locator.enabled=false
spring.cloud.gateway.server.webflux.routes[0].id=matricula-service-grupo11
spring.cloud.gateway.server.webflux.routes[0].uri=lb://MATRICULA-SERVICE-GRUPO11
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/matriculas/**
spring.cloud.gateway.server.webflux.routes[1].id=curso-service-grupo11
spring.cloud.gateway.server.webflux.routes[1].uri=lb://CURSO-SERVICE-GRUPO11
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/cursos/**
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false
